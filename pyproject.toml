[project]
name = "mro-removal-risk-model"
version = "0.1.0"
description = "Predict unscheduled component removal within the next 30 flight cycles"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "matplotlib>=3.9",
    "joblib>=1.4",
    "shap>=0.46",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
